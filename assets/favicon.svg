<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5e5dd" />
      <stop offset="50%" stop-color="#8ab3a0" />
      <stop offset="100%" stop-color="#52796f" />
    </linearGradient>
    <linearGradient id="goldShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae69e" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#967433" />
    </linearGradient>
    <linearGradient id="pearlGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8daf0" />
      <stop offset="100%" stop-color="#b89ec9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular aperlado y menta suave -->
  <circle cx="32" cy="32" r="30" fill="#f5f1eb" stroke="url(#goldShell)" stroke-width="2.2" />

  <!-- Concha marina estilizada en relieve dorado -->
  <path d="M 32 14 C 22 14 16 26 20 42 C 22 47 28 49 32 49 C 36 49 42 47 44 42 C 48 26 42 14 32 14 Z" fill="url(#seaGrad)" opacity="0.3" />
  
  <!-- Estructura de concha marina -->
  <path d="M 32 17 C 24 22 20 32 23 44 C 27 48 37 48 41 44 C 44 32 40 22 32 17 Z" fill="url(#goldShell)" />
  <path d="M 32 17 L 27 45 M 32 17 L 32 46 M 32 17 L 37 45" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

  <!-- Perla brillante en el centro inferior (Isabela) -->
  <circle cx="32" cy="42" r="6" fill="url(#pearlGrad)" filter="url(#softGlow)" />
  <circle cx="30" cy="40" r="1.5" fill="#ffffff" />

  <!-- Pequeña estrellita marina dorada -->
  <path d="M 44 20 L 45.2 23.5 L 49 23.8 L 46 26.2 L 47 29.8 L 44 27.8 L 41 29.8 L 42 26.2 L 39 23.8 L 42.8 23.5 Z" fill="#fae69e" stroke="#c5a059" stroke-width="0.5" />
</svg>
